<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101830"/>
    </linearGradient>
    <linearGradient id="contrib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="80" y="90" font-family="ui-sans-serif, system-ui, -apple-system" font-size="44" font-weight="700" fill="#f8fafc">Blog Agent — Modulabs OSS · LangChain v1 Migration</text>
  <text x="80" y="135" font-family="ui-monospace, monospace" font-size="22" fill="#94a3b8">9-node LangGraph · Sequential + HITL interrupt · 3 merged PRs</text>

  <!-- Workflow nodes (3 columns x 3 rows + START/END caps) -->
  <!-- Row 1 -->
  <g font-family="ui-sans-serif, system-ui" font-size="20" fill="#e2e8f0" text-anchor="middle">
    <rect x="60"  y="220" width="160" height="80" rx="14" fill="#334155"/>
    <text x="140" y="268" font-weight="600">START</text>

    <rect x="280" y="220" width="200" height="80" rx="14" fill="url(#node)" stroke="#22c55e" stroke-width="2"/>
    <text x="380" y="258" font-weight="600">FetchContent</text>
    <text x="380" y="285" font-size="14" fill="#22c55e">Playwright fallback (PR #54)</text>

    <rect x="540" y="220" width="200" height="80" rx="14" fill="url(#node)" stroke="#475569"/>
    <text x="640" y="268" font-weight="600">AnalyzeContent</text>

    <rect x="800" y="220" width="200" height="80" rx="14" fill="url(#node)" stroke="#22c55e" stroke-width="2"/>
    <text x="900" y="258" font-weight="600">SuggestKeywords</text>
    <text x="900" y="285" font-size="14" fill="#22c55e">한글 keyword fix</text>

    <rect x="1060" y="220" width="220" height="80" rx="14" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="1170" y="258" font-weight="600">HumanSelectKeywords</text>
    <text x="1170" y="285" font-size="14" fill="#fb923c">interrupt_before</text>

    <rect x="1340" y="220" width="200" height="80" rx="14" fill="url(#contrib)"/>
    <text x="1440" y="258" font-weight="700" fill="#0b1020">WebResearch</text>
    <text x="1440" y="285" font-size="14" fill="#0b1020">NEW · Tavily (PR #56)</text>
  </g>

  <!-- Row 2 -->
  <g font-family="ui-sans-serif, system-ui" font-size="20" fill="#e2e8f0" text-anchor="middle">
    <rect x="1340" y="420" width="200" height="80" rx="14" fill="url(#node)" stroke="#475569"/>
    <text x="1440" y="468" font-weight="600">WriteBlog</text>

    <rect x="1080" y="420" width="200" height="80" rx="14" fill="url(#node)" stroke="#475569"/>
    <text x="1180" y="468" font-weight="600">OptimizeSEO</text>

    <rect x="820" y="420" width="200" height="80" rx="14" fill="url(#node)" stroke="#475569"/>
    <text x="920" y="468" font-weight="600">GenerateImages</text>

    <rect x="560" y="420" width="200" height="80" rx="14" fill="url(#node)" stroke="#475569"/>
    <text x="660" y="468" font-weight="600">ConvertToHTML</text>

    <rect x="380" y="420" width="160" height="80" rx="14" fill="#334155"/>
    <text x="460" y="468" font-weight="600">END</text>
  </g>

  <!-- Edges Row 1 -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="220" y1="260" x2="278" y2="260"/>
    <line x1="480" y1="260" x2="538" y2="260"/>
    <line x1="740" y1="260" x2="798" y2="260"/>
    <line x1="1000" y1="260" x2="1058" y2="260"/>
    <line x1="1280" y1="260" x2="1338" y2="260"/>
  </g>

  <!-- Curve Row 1 → Row 2 -->
  <path d="M 1440 300 Q 1440 360 1440 420" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Edges Row 2 (right to left) -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="1338" y1="460" x2="1282" y2="460"/>
    <line x1="1078" y1="460" x2="1022" y2="460"/>
    <line x1="818" y1="460" x2="762" y2="460"/>
    <line x1="558" y1="460" x2="542" y2="460"/>
  </g>

  <!-- Contributions panel -->
  <g font-family="ui-sans-serif, system-ui" fill="#e2e8f0">
    <rect x="80" y="610" width="1440" height="220" rx="20" fill="#0f172a" stroke="#1e293b"/>
    <text x="110" y="660" font-size="22" font-weight="700" fill="#22c55e">3 merged PRs · 1,303 lines added</text>

    <rect x="110" y="690" width="430" height="120" rx="12" fill="#0b1020" stroke="#22c55e"/>
    <text x="130" y="722" font-size="18" font-weight="700">PR #51 — LangChain v1 Migration</text>
    <text x="130" y="750" font-size="14" fill="#94a3b8">init_chat_model · create_agent</text>
    <text x="130" y="772" font-size="14" fill="#94a3b8">v1 message types · CI workflow fix</text>
    <text x="130" y="794" font-size="14" fill="#64748b">+236 / −131</text>

    <rect x="585" y="690" width="430" height="120" rx="12" fill="#0b1020" stroke="#22c55e"/>
    <text x="605" y="722" font-size="18" font-weight="700">PR #54 — JS-rendered site fix</text>
    <text x="605" y="750" font-size="14" fill="#94a3b8">BeautifulSoup → Playwright fallback</text>
    <text x="605" y="772" font-size="14" fill="#94a3b8">Naver iframe · 36자 → 7,198자</text>
    <text x="605" y="794" font-size="14" fill="#64748b">+202 / −30</text>

    <rect x="1060" y="690" width="430" height="120" rx="12" fill="#0b1020" stroke="#22c55e"/>
    <text x="1080" y="722" font-size="18" font-weight="700">PR #56 — Tavily WebResearch node</text>
    <text x="1080" y="750" font-size="14" fill="#94a3b8">langchain-tavily · TavilySearch</text>
    <text x="1080" y="772" font-size="14" fill="#94a3b8">키워드 기반 web research workflow</text>
    <text x="1080" y="794" font-size="14" fill="#64748b">+865 / −68</text>
  </g>
</svg>
